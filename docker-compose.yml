services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: workflow
      POSTGRES_PASSWORD: workflow
      POSTGRES_DB: workflow
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workflow -d workflow"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - workflow-postgres:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  engine:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    environment:
      POSTGRES_DSN: "postgres://workflow:workflow@postgres:5432/workflow?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      AUTH_BOOTSTRAP_TOKEN: "dev-secret-token"
      WORKFLOW_CONFIG: ""
    ports:
      - "8080:8080"
      - "9090:9090"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  workflow-postgres:
